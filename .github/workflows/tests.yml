name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DOCKER_CONTEXT: default
      COMPOSE_PROJECT_NAME: soa-flight-booking-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install protoc 36.2
        run: |
          curl -fsSL https://github.com/protocolbuffers/protobuf/releases/download/v36.2/protoc-36.2-linux-x86_64.zip -o "$RUNNER_TEMP/protoc.zip"
          unzip -q "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
          echo "$RUNNER_TEMP/protoc/bin" >> "$GITHUB_PATH"
      - name: Generate, check generated files, run race tests and vet
        run: make check
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Install report CLI and test run selection
        run: |
          npm ci --ignore-scripts --no-fund --no-audit
          npm test
      - name: Integration against isolated PostgreSQL and Redis
        id: integration
        run: make integration
      - name: Start isolated Compose stack
        id: compose
        run: make up
      - name: Sequential Go E2E and failure scenarios
        id: e2e
        shell: bash
        run: |
          mkdir -p artifacts/e2e
          set -o pipefail
          make --silent e2e | tee artifacts/e2e/go-test.log
      - name: Generate Allure report, including failed runs
        if: ${{ always() && steps.e2e.outcome != 'skipped' }}
        run: make e2e-report
      - name: Collect Compose diagnostics
        if: ${{ always() && steps.integration.outcome != 'skipped' }}
        run: |
          mkdir -p artifacts/e2e
          docker compose ps -a > artifacts/e2e/compose-ps.txt
          docker compose logs --no-color > artifacts/e2e/compose.log 2>&1
      - name: Upload results, report and diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/e2e/
          if-no-files-found: warn
          retention-days: 14
      - name: Remove only this CI project and its volumes
        if: ${{ always() && steps.integration.outcome != 'skipped' }}
        run: docker compose --project-name "$COMPOSE_PROJECT_NAME" down --volumes --remove-orphans
